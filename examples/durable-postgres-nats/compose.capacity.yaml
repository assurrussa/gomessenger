services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gomessenger
      POSTGRES_USER: gomessenger
      POSTGRES_PASSWORD: gomessenger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gomessenger -d gomessenger"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - capacity-postgres-data:/var/lib/postgresql

  nats:
    image: nats:2.12.3-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - capacity-nats-data:/data

  capacity-api:
    build:
      context: ../..
      dockerfile: examples/durable-postgres-nats/Dockerfile.capacity
      target: capacity-api
    environment:
      POSTGRES_DSN: postgres://gomessenger:gomessenger@postgres:5432/gomessenger?sslmode=disable
      NATS_URL: nats://nats:4222
      HTTP_ADDR: :8080
      OUTBOX_WORKERS: ${OUTBOX_WORKERS:-4}
      NATS_CONSUMER_CONCURRENCY: ${NATS_CONSUMER_CONCURRENCY:-4}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-32}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    init: true

  capacity-runner:
    build:
      context: ../..
      dockerfile: examples/durable-postgres-nats/Dockerfile.capacity
      target: capacity-runner
    environment:
      POSTGRES_DSN: postgres://gomessenger:gomessenger@postgres:5432/gomessenger?sslmode=disable
      NATS_URL: nats://nats:4222
      CAPACITY_APP_URL: http://capacity-api:8080
      CAPACITY_RESULTS_DIR: /results
      K6_SCRIPT: /scripts/capacity.js
      CAPACITY_PROFILE: ${CAPACITY_PROFILE:-quick}
      CAPACITY_RATES: ${CAPACITY_RATES:-}
      CAPACITY_MIN_RATE: ${CAPACITY_MIN_RATE:-}
      CAPACITY_RUN_ID: ${CAPACITY_RUN_ID:-}
      CAPACITY_WARMUP_DURATION: ${CAPACITY_WARMUP_DURATION:-}
      CAPACITY_STAGE_DURATION: ${CAPACITY_STAGE_DURATION:-}
      CAPACITY_DRAIN_TIMEOUT: ${CAPACITY_DRAIN_TIMEOUT:-}
      CAPACITY_SAMPLE_INTERVAL: ${CAPACITY_SAMPLE_INTERVAL:-}
      CAPACITY_READY_TIMEOUT: ${CAPACITY_READY_TIMEOUT:-}
      CAPACITY_E2E_P95_SLO: ${CAPACITY_E2E_P95_SLO:-}
      OUTBOX_WORKERS: ${OUTBOX_WORKERS:-4}
      NATS_CONSUMER_CONCURRENCY: ${NATS_CONSUMER_CONCURRENCY:-4}
      CAPACITY_HOST_OS: ${CAPACITY_HOST_OS:-unknown}
      CAPACITY_HOST_ARCH: ${CAPACITY_HOST_ARCH:-unknown}
      CAPACITY_HOST_CPUS: ${CAPACITY_HOST_CPUS:-unknown}
      CAPACITY_GIT_COMMIT: ${CAPACITY_GIT_COMMIT:-unknown}
      CAPACITY_GIT_DIRTY: ${CAPACITY_GIT_DIRTY:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      capacity-api:
        condition: service_started
    volumes:
      - ../../tmp/capacity:/results
    init: true

volumes:
  capacity-postgres-data:
  capacity-nats-data:
